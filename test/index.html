<!--
  دفتر مالك — https://github.com/MalekAhmed01/daftar-malek
  ملف واحد فيه الشكل والصفحة والمنطق. الداتا مش هنا: بتتحفظ في الريبو الخاص daftar-malek-data (data/*.json).
  الصفحة بتوصل للداتا بمفتاح GitHub بيتحفظ في متصفح مالك بس.
-->
<title>دفتر مالك تجربة</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='4' width='52' height='56' rx='12' fill='%23E07A1F'/%3E%3Crect x='14' y='4' width='4' height='56' fill='%23B35A10'/%3E%3Cpath d='M27 33l7 7 14-15' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: a graph-paper notebook page — one narrow column, header, view switcher, task rows ruled like a pad. Priority = the four pen colors Malek already uses. */
:root{
  --paper:#F2F4F1; --sheet:#FBFCFA; --grid:#DFE4DE; --ink:#1D2430; --muted:#5E6876; --line:#C9D0C8;
  --accent:#2747A0; --accent-soft:#E3E8F6;
  --red:#C2313B; --yellow:#C98A0C; --blue:#2F6DB5; --black:#2A2F38;
  --done:#3F7D4E;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"Readex Pro","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15181E; --sheet:#1B1F27; --grid:#252A34; --ink:#E6E9EE; --muted:#9AA3B1; --line:#343A46;
  --accent:#8EA6F0; --accent-soft:#252E48;
  --red:#F06A72; --yellow:#E8B240; --blue:#6FA6E8; --black:#C3C9D3; --done:#74C08A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15181E; --sheet:#1B1F27; --grid:#252A34; --ink:#E6E9EE; --muted:#9AA3B1; --line:#343A46;
  --accent:#8EA6F0; --accent-soft:#252E48;
  --red:#F06A72; --yellow:#E8B240; --blue:#6FA6E8; --black:#C3C9D3; --done:#74C08A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;margin:0;line-height:1.2;text-wrap:balance}
.date{color:var(--muted);font-size:14px}
.counts{display:flex;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.counts b{color:var(--ink);font-size:18px;font-weight:600;margin-inline-end:4px}

.tabs{display:flex;gap:4px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:4px;overflow-x:auto}
.tabs button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:8px 12px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);font:inherit;font-size:14px;font-weight:500;padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.btn:focus-visible,.tabs button:focus-visible,.chip:focus-visible,.check:focus-visible,.mini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:4px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-position:-1px -1px}
.section{padding:6px 0}
.section h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0;padding:12px 16px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section h2 small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.empty{padding:10px 16px 16px;color:var(--muted);font-size:14px}

.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 16px;border-top:1px solid var(--line);background:var(--sheet)}
.task:first-of-type{border-top:0}
.check{width:22px;height:22px;margin-top:2px;border:2px solid var(--pc,var(--black));border-radius:5px;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--sheet);padding:0}
.task.is-done .check{background:var(--done);border-color:var(--done)}
.task.is-done .title{text-decoration:line-through;color:var(--muted)}
.body{min-width:0;cursor:pointer}
.title{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--muted);margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.late{color:var(--red);font-weight:500}
.mini{border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:3px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.mini.on{color:var(--accent);border-color:var(--accent)}
.p-red{--pc:var(--red)} .p-yellow{--pc:var(--yellow)} .p-blue{--pc:var(--blue)} .p-black{--pc:var(--black)}

/* subtasks */
.subprog{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:1px 9px 1px 8px;cursor:pointer;font-variant-numeric:tabular-nums}
.subprog .track{width:44px;height:6px;display:block}
.subprog .fill{display:block;background:var(--done)}
.subprog[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.subs{grid-column:1/-1;display:flex;flex-direction:column;gap:2px;margin-inline-start:32px;padding-inline-start:12px;border-inline-start:2px solid var(--line)}
.sub{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:6px 0;border-top:1px dashed var(--line)}
.sub:first-child{border-top:0}
.sub .check{width:19px;height:19px;font-size:12px}
.sub.is-done .check{background:var(--done);border-color:var(--done)}
.sub.is-done .title{text-decoration:line-through;color:var(--muted)}
.sub .title{font-weight:400;font-size:14px}
.subs form{padding-top:6px}
.parent-of{color:var(--accent)}
.closed-note{font-size:12.5px;color:var(--muted)}
.rs{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.rs:first-of-type{border-top:0}
.rs .title{font-weight:500}
.test-flag{font-size:13px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:7px 10px}
.cl-form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.cl-form label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.cl-form input{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.cl-form input[type=number]{width:90px}
.cl-tasks{margin:0 -16px}
.cl-tasks .task:first-child{border-top:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}

/* week view */
.week{padding:8px 16px 16px;display:flex;flex-direction:column;gap:8px}
.trend{padding:4px 16px 14px;display:flex;flex-direction:column;gap:6px}
.trend-sum{font-size:13.5px;color:var(--muted)}
.trend-sum b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tb-bars{display:flex;gap:4px;border-bottom:1px solid var(--line);padding-top:20px}
.tb{flex:1;height:96px;position:relative;display:flex;justify-content:center;align-items:flex-end;outline:none;border-radius:4px}
.tb i{display:block;width:100%;max-width:22px;background:var(--accent);border-radius:4px 4px 0 0;opacity:.45}
.tb.now i{opacity:1}
.tb b{position:absolute;left:0;right:0;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;visibility:hidden;line-height:1}
.tb.show b,.tb:hover b,.tb:focus-visible b{visibility:visible}
.tb:hover i,.tb:focus-visible i{opacity:1}
.tb:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.tb-days{display:flex;gap:4px}
.tb-days span{flex:1;text-align:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tb-days span.now{color:var(--ink);font-weight:600}
.wrow{display:grid;grid-template-columns:130px 1fr 28px;gap:10px;align-items:center;font-size:14px}
.track{height:10px;background:var(--grid);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:5px}
.wrow.zero .name{color:var(--red)}
.wby{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);padding-inline-start:140px;margin-top:-4px}
@media (max-width:440px){.wby{padding-inline-start:110px}}
.wrow span:last-child{font-variant-numeric:tabular-nums;text-align:end}
@media (max-width:440px){.wrow{grid-template-columns:100px 1fr 24px}}

/* projects */
.proj{border-top:1px solid var(--line);background:var(--sheet);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.proj:first-child{border-top:0;border-radius:12px 12px 0 0}
.proj-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.proj-head h3{font-family:var(--f-display);font-weight:500;font-size:19px;margin:0}
.proj-goal{font-size:13.5px;color:var(--muted);margin:0}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .track{flex:1}
.prog .fill{background:var(--done)}
.next{font-size:13.5px;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:7px 10px}
.next b{color:var(--accent);font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:start;padding:6px 0;border-top:1px dashed var(--line)}
.step .check{width:19px;height:19px;border-color:var(--muted);font-size:12px}
.step.on .check{background:var(--done);border-color:var(--done)}
.step.on .st{text-decoration:line-through;color:var(--muted)}
.st{overflow-wrap:anywhere;font-size:14px}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:16px;line-height:1;padding:2px 4px}
.inline{display:flex;gap:6px}
.inline input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.log{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.log li{display:flex;gap:8px}
.log time{color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums}
details.more summary{cursor:pointer;font-size:13px;color:var(--accent)}
.proj-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* routine + notes */
.routine{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 14px}
.rt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px 6px 10px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.rt .box{width:18px;height:18px;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-size:11px;color:var(--sheet)}
.rt.on{border-color:var(--done)}
.rt.on .box{background:var(--done);border-color:var(--done)}
.rt.on span:last-child{color:var(--muted)}
.hint{display:block;margin:0 16px 12px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font:inherit;font-size:13.5px;border:0;text-align:start;cursor:pointer;width:calc(100% - 32px)}
.note-card{border-top:1px solid var(--line);background:var(--sheet);padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.note-card.review{box-shadow:inset -3px 0 0 var(--yellow)}
.note-top{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;color:var(--muted);align-items:center}
.by{font-weight:600;color:var(--ink)}
.by.claude{color:var(--accent)}
.note-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.note-actions{display:flex;gap:6px;flex-wrap:wrap}
.compose{padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--sheet);border-radius:12px 12px 0 0}
.compose textarea{font:inherit;font-size:14.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:70px;resize:vertical;width:100%}
.compose-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.compose-row select{font:inherit;font-size:13.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px}

/* editor */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.editor{background:var(--sheet);color:var(--ink);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
@media (min-width:640px){.overlay{align-items:center}.editor{border-radius:14px}}
.editor h3{font-family:var(--f-display);font-weight:500;margin:0;font-size:20px}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.lab{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.editor input,.editor select,.editor textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.editor textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.row2{grid-template-columns:1fr}}
.pris{display:flex;gap:6px;flex-wrap:wrap}
.pris button{flex:1 1 0;min-width:90px;font:inherit;font-size:13px;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:7px 6px;border-radius:8px;cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center}
.pris button[aria-pressed="true"]{border-color:var(--pc);background:var(--paper)}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.actions .grow{display:flex;gap:8px}
.danger{color:var(--red)}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:8px;font-size:14px;z-index:30}
.editor .paper-out{min-height:min(62vh,560px);max-height:70vh;line-height:1.9;font-size:15px;resize:vertical}
.paper-out{width:100%;min-height:200px;font:inherit;font-size:14px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap}
@media (prefers-reduced-motion:no-preference){.task{transition:background .15s}.check{transition:background .15s}}
</style>
<style>
/* refinement pass: plain sheets instead of graph paper, one type family with a weight scale */
h1{font-weight:700;font-size:32px;letter-spacing:0}
.counts{gap:8px}
.counts span{background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:3px 12px;display:inline-flex;align-items:baseline;gap:6px}
.counts b{font-weight:600;font-size:17px;margin:0}
.tabs{padding:5px;border-radius:12px}
.tabs button{font-weight:500;font-size:15px;padding:8px 14px;border-radius:8px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--sheet)}
.bar{justify-content:flex-start}
.bar .legend{margin-inline-start:auto}
.btn{font-weight:500;font-size:14.5px;padding:8px 16px;border-radius:9px}
.sheet{background-image:none;background:transparent;border:0;display:flex;flex-direction:column;gap:14px}
.sheet>.section,.sheet>.proj,.sheet>form.proj,.sheet>.compose,.sheet>.empty{background:var(--sheet);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sheet>.proj:first-child{border-radius:14px}
.section{padding:0}
.section h2{font-weight:600;font-size:18px;padding:14px 16px 8px;align-items:center}
.section h2 small{background:var(--paper);border-radius:999px;padding:1px 9px;font-size:12px}
.task{padding:12px 16px;transition:background .12s}
.task:hover{background:color-mix(in srgb,var(--sheet) 94%,var(--ink))}
.task>.body .title{font-weight:500;font-size:15.5px;line-height:1.55}
.task.is-done>.body .title{font-weight:400}
.check{width:24px;height:24px;border-radius:7px;margin-top:3px}
.meta{gap:4px 12px}
.tools{display:flex;gap:6px;align-items:flex-start}
.mini{border-radius:999px;padding:3px 11px}
.mini.on{background:var(--accent-soft)}
.proj-head h3{font-weight:600;font-size:19px}
.editor h3{font-weight:600;font-size:20px}
.routine{padding:2px 16px 16px}
.empty{padding:6px 16px 16px}
.legend .dot{display:inline-block}
.quick{display:flex;gap:6px;padding:0 16px 12px;flex-wrap:wrap}
.quick input{flex:1 1 120px;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
.quick select{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.quick input:focus-visible,.quick select:focus-visible,.inline input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.task{transition:none}}
.sync{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--sheet);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--done)}
.sync.busy i{background:var(--blue)}
.sync.err{color:var(--red);border-color:var(--red);cursor:pointer}
.sync.err i{background:var(--red)}
.gh{padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.gh h2{margin:0;font-size:20px;font-weight:600}
.gh ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.gh code{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:13px;direction:ltr;unicode-bidi:isolate}
.gh label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.gh input{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 11px;direction:ltr;text-align:left}
.gh .err{color:var(--red);font-size:14px}
.gh a{color:var(--accent)}
.foot{display:flex;justify-content:center;gap:16px;padding:6px 0 0}

<script>
const LS=(()=>{const k=x=>x==="gh-cfg"?x:"test:"+x;return{getItem:x=>localStorage.getItem(k(x)),setItem:(x,v)=>localStorage.setItem(k(x),v),removeItem:x=>localStorage.removeItem(k(x))}})();
const AREAS=[["work","شغل"],["content","محتوى"],["study","مذاكرة"],["side","مشاريع جانبية"],["personal","شخصي"]];
const PERSONAL=new Set(["personal"]);
const KINDS={work:[],
  content:[["script","اسكريبت"],["shoot","تصوير"],["edit","إيديت"],["visual","تغذية بصرية"]],
  study:[["edit","إيديت"],["cyber","سايبر"]],
  side:[["spices","بهارات"],["cake","كيك"],["claude","كلود والدفتر"]],
  personal:[["family","عيلة ومشاوير"],["health","صحة ورياضة"]]};
const kindName=t=>((KINDS[t.area]||[]).find(k=>k[0]===t.kind)||[])[1]||"";
const LEGACY={clients:["work",""],leads:["work",""],content:["content",""],edit:["study","edit"],cyber:["study","cyber"],
  spices:["side","spices"],cake:["side","cake"],claude:["side","claude"],personal:["personal","family"],health:["personal","health"]};
const normArea=x=>{const m=LEGACY[x.area];if(m&&m[0]!==x.area){x.area=m[0];x.kind=x.kind||m[1]}else if(m&&!x.kind&&m[1])x.kind=m[1];if(x.ctype&&!x.kind)x.kind=x.ctype;return x};
const AREA=Object.fromEntries(AREAS);
const PRI=[["red","مهم جداً"],["blue","أقل أهمية"],["black","ممكن يتأجل"]];
const PRI_RANK={red:0,yellow:1,blue:2,black:3};
const STAGE={draft:"درافت",edits:"تعديلات",delivery:"تسليم"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ymd=d=>d.toLocaleDateString("en-CA");
const today=()=>ymd(new Date());
const fmtDay=s=>{try{return new Date(s+"T12:00").toLocaleDateString("ar-u-nu-latn",{weekday:"long",day:"numeric",month:"long"})}catch(e){return s}};

let projects=[], projCol=null, pendingRender=false;
let routineItems=[{id:"ward",t:"الورد اليومي"},{id:"sabah",t:"أذكار الصباح"},{id:"masaa",t:"أذكار المساء"}], routineDays={}, routCol=null;
let notes=[], notesCol=null;
let clients=[], clientsCol=null, clEdit=null;
const cname=s=>String(s||"").trim();
function clientNames(){const s=new Set(clients.map(c=>cname(c.name)));
  tasks.forEach(t=>{if(t.area==="work"&&t.kind!=="leads"&&!t.parentId&&cname(t.client))s.add(cname(t.client))});return [...s].filter(Boolean)}
function clientStats(name){const n=cname(name);const c=clients.find(x=>cname(x.name)===n)||null;
  const ts=tasks.filter(t=>!t.parentId&&cname(t.client)===n);
  const open=ts.filter(t=>t.status!=="done"), done=ts.filter(t=>t.status==="done");
  let pkg=null;if(c&&c.mode!=="single"&&c.target>0){const since=c.since||"";
    pkg={target:c.target,since,done:done.filter(t=>t.kind!=="leads"&&!t.noPkg&&(!since||(t.doneDate||"")>=since)).length}}
  return {c,open,done,pkg}}
document.addEventListener("focusout",()=>{if(pendingRender){setTimeout(()=>{const a=document.activeElement;if(!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"))){pendingRender=false;render()}},0)}});
let tasks=[], loaded=false, db=null, col=null, view="today", areaFilter="", editing=null, edPri="blue";

function setTabs(){document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===view));const g=document.getElementById("open-settings");if(g)g.setAttribute("aria-pressed",view==="settings")}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}

const subsOf=id=>tasks.filter(t=>t.parentId===id).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const parentOf=t=>t&&t.parentId?tasks.find(p=>p.id===t.parentId)||null:null;
const isTop=t=>!parentOf(t);
const clip=(s,n=40)=>s.length>n?s.slice(0,n)+"…":s;
let expanded=new Set();try{expanded=new Set(JSON.parse(LS.getItem("expanded")||"[]"))}catch(_){}
const saveExpanded=()=>{try{LS.setItem("expanded",JSON.stringify([...expanded]))}catch(_){}};
const sortTasks=a=>a.slice().sort((x,y)=>(PRI_RANK[x.pri]??9)-(PRI_RANK[y.pri]??9)||(x.due||"9999").localeCompare(y.due||"9999")||(x.createdAt||0)-(y.createdAt||0));
const isOpen=t=>t.status!=="done";
const DOW=["الحد","الاتنين","التلات","الأربع","الخميس","الجمعة","السبت"];
const repDue=t=>!!(t.repeat&&(t.repeat.days||[]).includes(new Date().getDay()));
const inToday=t=>isOpen(t)&&(t.repeat?(t.lastDone!==today()&&t.skip!==today()&&(repDue(t)||(t.planDate&&t.planDate<=today()))):(t.planDate&&t.planDate<=today()));
const repText=r=>{const d=(r&&r.days)||[];if(d.length===7)return "كل يوم";return "كل "+[6,0,1,2,3,4,5].filter(x=>d.includes(x)).map(x=>DOW[x]).join(" و")};

function row(t,{showPlan=true,noArea=false,noClient=false,timer=false,noDone=false}={}){
  const done=t.status==="done";
  const late=!done&&t.planDate&&t.planDate<today();
  const overdue=!done&&t.due&&t.due<today();
  const parent=parentOf(t);
  const subs=parent?[]:subsOf(t.id);
  const meta=[];
  if(parent)meta.push(`<span class="tag parent-of">↳ ${esc(clip(parent.title))}</span>`);
  if(t.course){const [d,n]=courseCount(t.course);
    meta.push(`<button type="button" class="subprog" data-expand="c:${t.id}" aria-expanded="${expanded.has("c:"+t.id)}"><span class="track"><span class="fill" style="width:${n?d/n*100:0}%"></span></span>${n?`${d}/${n} درس`:"ضيف الفصول"}</button>`)}
  if(subs.length){const d=subs.filter(s=>s.status==="done").length;
    meta.push(`<button type="button" class="subprog" data-expand="${t.id}" aria-expanded="${expanded.has(t.id)}"><span class="track"><span class="fill" style="width:${d/subs.length*100}%"></span></span>${d}/${subs.length}</button>`)}
  if(!noArea)meta.push(`<span class="tag">${esc(AREA[t.area]||"")}</span>`);
  if(t.client&&!parent&&!noClient)meta.push(`<span class="tag">${esc(t.client)}</span>`);
  if(kindName(t)&&!parent)meta.push(`<span class="tag">${esc(kindName(t))}</span>`);
  if(t.due)meta.push(`<span class="tag ${overdue?"late":""}">ديدلاين ${esc(fmtDay(t.due))}</span>`);
  if(done&&t.doneDate&&t.doneDate!==today()&&!noDone)meta.push(`<span class="tag">خلص ${esc(fmtDay(t.doneDate))}</span>`);
  if(late&&!t.repeat)meta.push(`<span class="tag late">متأجل من ${esc(fmtDay(t.planDate))}</span>`);
  if(t.repeat&&!done)meta.push(`<span class="tag rep">↻ ${esc(repText(t.repeat))}</span>`);
  const fm=focusOf(t);if(fm)meta.push(`<span class="tag" title="وقت التركيز">⏱ ${fmtMin(fm)}</span>`);
  const planned=t.planDate&&t.planDate>=today();
  const onT=t.repeat?inToday(t):(planned||late);
  const planBtn=(!done&&showPlan)?`<button class="mini ${onT?"on":""}" data-plan="${t.id}" type="button">${onT?(view==="today"?"أجّل":"✓ النهارده"):"+ النهارده"}</button>`:"";
  return `<div class="task p-${t.pri||"black"} ${done?"is-done":""}">
    <button class="check" data-toggle="${t.id}" type="button" aria-label="${done?"رجّعه مفتوح":"خلص"}">${done?"✓":""}</button>
    <div class="body" data-edit="${t.id}"><div class="title">${esc(t.title)}</div>${t.closeNote?`<div class="closed-note">اتقفل بنوت: ${esc(t.closeNote)}</div>`:""}<div class="meta">${meta.join("")}</div></div>
    ${timer&&!done?`<div class="tools"><button class="mini pomo-go" type="button" data-pomo="${t.id}" aria-label="ابدأ التايمر على ${esc(t.title)}">${pomo&&pomo.id===t.id&&pomo.kind==="focus"&&!pomo.doneAt?(pomo.pausedAt?"واقف":"● شغال"):IC.play+`<span class="pn">${pset.focus}</span>`}</button>${planBtn}</div>`:(planBtn||nightFix(t)||"<span></span>")}${!parent&&expanded.has(t.id)?subsBlock(t,subs):""}${t.course&&expanded.has("c:"+t.id)?courseBlock(t):""}</div>`;
}
function subRow(s){
  const done=s.status==="done";
  const planned=!done&&s.planDate&&s.planDate>=today(), late=!done&&s.planDate&&s.planDate<today();
  const meta=[];
  if(s.due)meta.push(`<span class="tag ${!done&&s.due<today()?"late":""}">ديدلاين ${esc(fmtDay(s.due))}</span>`);
  if(late)meta.push(`<span class="tag late">متأجل من ${esc(fmtDay(s.planDate))}</span>`);
  return `<div class="sub p-${s.pri||"black"} ${done?"is-done":""}">
    <button class="check" data-toggle="${s.id}" type="button" aria-label="${done?"رجّعه مفتوح":"خلص"}">${done?"✓":""}</button>
    <div class="body" data-edit="${s.id}"><div class="title">${esc(s.title)}</div>${s.closeNote?`<div class="closed-note">اتقفل بنوت: ${esc(s.closeNote)}</div>`:""}${meta.length?`<div class="meta">${meta.join("")}</div>`:""}</div>
    ${done?"<span></span>":`<button class="mini ${planned||late?"on":""}" data-plan="${s.id}" type="button">${planned||late?(view==="today"?"أجّل":"✓ النهارده"):"+ النهارده"}</button>`}</div>`;
}
function subsBlock(t,subs){
  return `<div class="subs">${subs.map(subRow).join("")}
    <form class="inline" data-addsub="${t.id}"><input id="addsub-${t.id}" placeholder="تاسك فرعي جديد" maxlength="160" aria-label="تاسك فرعي جديد"><button class="btn" type="submit">أضف</button></form></div>`;
}

let folded=new Set();try{folded=new Set(JSON.parse(LS.getItem("folded")||"[]"))}catch(_){}
const ARR=`<span class="arr" aria-hidden="true"><svg width="12" height="8" viewBox="0 0 12 8"><path d="M1 1.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
function foldSection(key,title,list,opts,emptyMsg){
  const shut=folded.has(key);
  return `<section class="section ${shut?"folded":""}"><h2><button type="button" class="fold" data-fold="${key}" aria-expanded="${!shut}">${ARR}${title}</button><small>${list.length}</small></h2>${shut?"":list.length?list.map(t=>row(t,opts)).join(""):`<div class="empty">${emptyMsg}</div>`}</section>`;
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-fold]");if(!b)return;const k=b.dataset.fold;
  folded.has(k)?folded.delete(k):folded.add(k);try{LS.setItem("folded",JSON.stringify([...folded]))}catch(_){}
  render();const nb=document.querySelector(`[data-fold="${k}"]`);if(nb)nb.focus()});
let doneDay="";
const prevDay=d=>ymd(new Date(new Date(d+"T12:00").getTime()-864e5));
const nextDay=d=>ymd(new Date(new Date(d+"T12:00").getTime()+864e5));
const dayName=d=>d===today()?"النهارده":d===prevDay(today())?"امبارح":d===nextDay(today())?"بكره":fmtDay(d);
function doneDayView(){
  const d=doneDay&&doneDay<today()?doneDay:today();
  const l=tasks.filter(t=>t.status==="done"&&isTop(t)&&t.doneDate===d).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  return `<section class="section"><h2><span class="h-t">اللي خلص${d<today()?`<button type="button" class="h-link" data-dday="0">ارجع للنهارده</button>`:""}</span><small>${l.length}</small></h2><div class="dnav">
    <button type="button" data-dday="-1" aria-label="اليوم اللي قبله">›</button>
    <span class="dlab"><button type="button" data-dpick="1" title="اختار يوم">${esc(dayName(d))} <span aria-hidden="true" class="car">▾</span></button><input type="date" id="dpick" max="${today()}" value="${d}" aria-label="اختار يوم" tabindex="-1"></span>
    <button type="button" data-dday="1" aria-label="اليوم اللي بعده" ${d>=today()?"disabled":""}>‹</button></div>
    ${l.length?l.map(t=>row(t,{showPlan:false,noDone:true})).join(""):`<div class="empty">مفيش حاجة خلصت ${d===today()?"النهارده لسه":"اليوم ده"}.</div>`}</section>`;
}
document.addEventListener("click",e=>{if(!e.target.closest("[data-dpick]"))return;const i=$("#dpick");try{i.showPicker()}catch(_){i.style.pointerEvents="auto";i.focus();i.click()}});
document.addEventListener("change",e=>{if(e.target.id!=="dpick"||!e.target.value)return;doneDay=e.target.value>=today()?"":e.target.value;render()});
document.addEventListener("click",e=>{const b=e.target.closest("[data-dday]");if(!b||b.disabled)return;const k=+b.dataset.dday;
  const d=doneDay&&doneDay<today()?doneDay:today();doneDay=k===0?"":k<0?prevDay(d):nextDay(d);if(doneDay>=today())doneDay="";
  render();const nb=document.querySelector(`[data-dday="${k}"]`);if(nb&&!nb.disabled)nb.focus()});
function nightFix(t){
  if(t.status!=="done"||!t.doneAt||!t.doneDate)return "";const at=new Date(t.doneAt);if(at.getHours()>=6)return "";const real=ymd(at);
  if(t.doneDate===real)return `<button class="mini night" type="button" data-nday="${t.id}" data-to="${prevDay(real)}" title="خلص الساعة ${at.getHours()||12} بالليل">احسبه على ${esc(dayName(prevDay(real)))}</button>`;
  if(t.doneDate===prevDay(real))return `<button class="mini night on" type="button" data-nday="${t.id}" data-to="${real}" title="محسوب على اليوم اللي قبله">رجّعه لـ${esc(dayName(real))}</button>`;
  return "";
}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-nday]");if(!b)return;
  if(await write(b.dataset.nday,{doneDate:b.dataset.to}))toast("اتحسب على "+dayName(b.dataset.to))});
/* reads «ميتنج مع محمد بكره الساعة 5» → {title:"ميتنج مع محمد", date:"2026-10-21", time:"17:00"}.
   only for text that says it's a meeting/call; needs a time. day defaults to today, or tomorrow if that time has passed. */
const MEET_RE=/(ميتنج|ميتينج|مييتنج|اجتماع|مقابلة|مقابله|انترفيو|إنترفيو|مكالمة|مكالمه|كول|call|meeting|zoom|زوم)/i;
const AR_DAYS=[["الأحد","الاحد","الحد","حد"],["الاثنين","الإثنين","الاتنين","اتنين","اثنين"],["الثلاثاء","التلات","الثلاث","التلاتاء","تلات"],["الأربعاء","الاربعاء","الأربع","الاربع","اربع"],["الخميس","خميس"],["الجمعة","الجمعه","جمعة","جمعه"],["السبت","سبت"]];
const AR_MONTHS={"يناير":1,"فبراير":2,"مارس":3,"ابريل":4,"أبريل":4,"مايو":5,"يونيو":6,"يوليو":7,"اغسطس":8,"أغسطس":8,"سبتمبر":9,"اكتوبر":10,"أكتوبر":10,"نوفمبر":11,"ديسمبر":12};
function parseMeet(raw,now){
  now=now||new Date();
  let s=String(raw).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\s+/g," ").trim();
  if(!MEET_RE.test(s))return null;
  const cut=re=>{const m=s.match(re);if(m)s=(s.slice(0,m.index)+" "+s.slice(m.index+m[0].length)).replace(/\s+/g," ").trim();return m};
  const base=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const addD=n=>new Date(base.getFullYear(),base.getMonth(),base.getDate()+n);
  let day=null,h=null,mi=0,ampm="",m;
  // dates with numbers first, so their numbers aren't read as the time
  {m=cut(/(\d{1,2})\s*[\/\-]\s*(\d{1,2})/);if(m){day=new Date(base.getFullYear(),+m[2]-1,+m[1]);if(day<base)day.setFullYear(day.getFullYear()+1)}}
  if(!day){m=cut(new RegExp("(\\d{1,2})\\s*("+Object.keys(AR_MONTHS).join("|")+")"));if(m){day=new Date(base.getFullYear(),AR_MONTHS[m[2]]-1,+m[1]);if(day<base)day.setFullYear(day.getFullYear()+1)}}
  const T="(\\d{1,2})(?:[:.](\\d{2}))?\\s*(?:و\\s*(نص|ربع|تلت|ثلث))?\\s*(?:(إلا|الا)\\s*(ربع|تلت|ثلث))?";
  const AP="(صباحاً|صباحا|الصبح|الصبحية|صباح|ص|الضهر|الظهر|ضهر|ظهر|العصر|عصر|المغرب|مغرب|بالليل|بليل|الليل|مساءً|مساء|م|pm|am)";
  m=cut(new RegExp("(?:ال)?(?:الساعه|الساعة|ساعة|ساعه)\\s*"+T+"\\s*"+AP+"?(?=\\s|$)","i"))||cut(new RegExp("(?:^|\\s)"+T+"\\s*"+AP+"(?=\\s|$)","i"))||cut(new RegExp("(?:^|\\s)"+T+"(?=\\s|$)"));
  if(m){h=+m[1];mi=m[2]?+m[2]:0;
    if(m[3])mi={"نص":30,"ربع":15,"تلت":20,"ثلث":20}[m[3]];
    if(m[4]){mi=60-{"ربع":15,"تلت":20,"ثلث":20}[m[5]];h=h-1}
    ampm=(m[6]||"").toLowerCase();}
  const noTime=h==null||h>23||mi>59;if(noTime){h=0;mi=0;ampm="ص"}
  const morning=/^(صباحاً|صباحا|الصبح|الصبحية|ص|صباح|am)$/.test(ampm);
  if(h>=1&&h<=11&&!morning)h+=12;           // 1–11 with no "ص" = afternoon/evening
  if(h===12&&morning)h=0;
  if(h===24)h=12;
  // day
  if(cut(/بعد\s*(بكره|بكرة|بكرا)/))day=addD(2);
  else if(cut(/(بكره|بكرة|بكرا|غدا|غداً)/))day=addD(1);
  else if(cut(/(النهارده|النهاردة|انهارده|اليوم ده|النهار ده)/))day=addD(0);
  if(!day){for(let i=0;i<7&&!day;i++)for(const w of AR_DAYS[i]){const r=new RegExp("(?:يوم\\s*)?(?:^|\\s)"+w+"(?=\\s|$)");if(r.test(s)){cut(r);let n=(i-base.getDay()+7)%7;day=addD(n);break}}}
  cut(/(?:^|\s)يوم(?=\s|$)/);

const AI_SYS=`انت «المساعد» جوه دفتر مالك. مالك فيديو إيديتور وموشن ديزاينر في مصر. بتساعده يقسّم تسكاته وينظّمها ويتابعها، بالمصري، مختصر وواضح.
قواعد الدفتر:
- الألوان: red مهم جداً، blue أقل أهمية (الافتراضي)، black ممكن يتأجل. الترتيب: الأحمر، بعده الأزرق، بعده الأسود.
- شغل العملاء (القسم work) أولوية أولى لما اليوم يتزنق.
- معاد نومه مش ثابت، فخطة اليوم بتتبني على عدد الساعات من وقت ما صحي. لو مقالش صحي إمتى وقدامه كام ساعة واتطلب منك خطة، اسأله.
- خلي بالك من اللي متأجل من أيام، واسأله يتعمل النهارده ولا يتأجل ولا يتشال.
- التاسك الكبير يتقسم لتسكات فرعية صغيرة واضحة (كل واحدة حاجة تتعمل في قعدة).
- متمسحش أي حاجة. ومتقترحش تغيير غير لما يكون مفيد.
رد دايماً بـ JSON بس، من غير أي كلام برّاه، بالشكل ده:
{"reply":"كلامك لمالك (سطور قصيرة)","actions":[...]}
الـ actions اقتراحات، مالك هو اللي هيوافق عليها. الأنواع المسموحة:
{"type":"plan","id":"<id>"} يحط التاسك في النهارده
{"type":"unplan","id":"<id>"} يشيله من النهارده
{"type":"pri","id":"<id>","pri":"red|blue|black"}
{"type":"add","title":"...","area":"work|content|study|side|personal","pri":"blue","client":"","today":true}
{"type":"sub","parent":"<id>","title":"..."} تاسك فرعي تحت تاسك موجود
{"type":"done","id":"<id>"} لو مالك قال إنه خلّصه
{"type":"note","text":"..."} نوت يرجعلها بعدين
استخدم الـ ids زي ما هي في القايمة بالظبط. لو مفيش تغيير، "actions":[]`;

function aiParse(raw){

  const ok=x=>x&&typeof x==="object";

    if(["plan","unplan","pri","done"].includes(x.type))return tasks.some(t=>t.id===x.id)&&(x.type!=="pri"||["red","blue","black"].includes(x.pri));

  const groups=[["red","مهم جداً"],["blue","أقل أهمية"],["black","لو فضل وقت"]];
  for(const [p,n] of groups){const g=sortTasks(list.filter(t=>t.pri===p));if(!g.length)continue;

/* ===== storage on GitHub =====
   each collection is one JSON file in the private data repo: data/<collection>.json = {"<doc id>": {...}}.
   writes apply on screen at once, then go to GitHub in one commit per file (debounced);
   a conflict (someone else committed first) re-reads the file and replays our changes on top.
   unsent changes are kept in this browser and sent on the next open. */
const GH_CFG_KEY="gh-cfg", GH_PENDING_KEY="gh-pending", GH_CACHE_KEY="gh-cache";
const ghLoad=k=>{try{return JSON.parse(LS.getItem(k)||"null")}catch(_){return null}};
const ghSave=(k,v)=>{try{v==null?LS.removeItem(k):LS.setItem(k,JSON.stringify(v))}catch(_){}};
const b64enc=s=>{const b=new TextEncoder().encode(s);let bin="";for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s/g,"")),c=>c.charCodeAt(0)));
const clone=o=>JSON.parse(JSON.stringify(o));
var ghScreen=false;
function setSync(state,text){const el=$("#sync");if(!el)return;clearTimeout(setSync._t);el.hidden=false;el.className="sync"+(state?" "+state:"");$("#sync-t").textContent=text;
  if(!state)setSync._t=setTimeout(()=>{el.hidden=true},1800)}
class GitHubDB{
  constructor(cfg){this.cfg={...cfg,branch:"test"};this.files={};this.pending=ghLoad(GH_PENDING_KEY)||{};this.cache=ghLoad(GH_CACHE_KEY)||{};this.authBad=false;
    this.api=`https://api.github.com/repos/${cfg.repo}`;
    setInterval(()=>this.poll(),60000);
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")this.poll()});
    addEventListener("beforeunload",e=>{if(this.busy()){e.preventDefault();e.returnValue=""}});}
  busy(){return Object.values(this.files).some(f=>f.inflight||f.timer)||Object.values(this.pending).some(a=>a&&a.length)}
  async req(path,opt={}){
    const r=await fetch(this.api+path,{cache:"no-store",...opt,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+this.cfg.token,"X-GitHub-Api-Version":"2022-11-28",...(opt.body?{"Content-Type":"application/json"}:{})}});
    if(r.status===401){this.authBad=true;setSync("err","المفتاح مش شغال");}
    return r;
  }
  file(name){if(!this.files[name]){const c=this.cache[name];
      this.files[name]={name,docs:c?c.docs:{},sha:c?c.sha:null,subs:[],loaded:!!c,inflight:false,timer:null,again:false,retry:0};
      if(c)setTimeout(()=>this.emit(name),0);
      this.fetch(name).then(()=>this.flushSoon(name,10)).catch(e=>this.fail(name,e));}
    return this.files[name]}
  async fetch(name){
    const f=this.files[name];const r=await this.req(`/contents/data/${name}.json?ref=${encodeURIComponent(this.cfg.branch||"main")}`);
    if(r.status===404){f.docs={};f.sha=null}
    else if(!r.ok)throw new Error("http "+r.status);
    else{const j=await r.json();let txt;
      if(j.content&&j.encoding==="base64")txt=b64dec(j.content);
      else{const b=await this.req(`/git/blobs/${j.sha}`);if(!b.ok)throw new Error("blob "+b.status);txt=b64dec((await b.json()).content)}
      f.docs=txt.trim()?JSON.parse(txt):{};f.sha=j.sha}
    this.replay(name);f.loaded=true;this.remember(name);this.emit(name);
    if(Object.values(this.files).every(x=>x.loaded)&&!this.busy())setSync("","اتحفظ");
  }
  replay(name){const f=this.files[name];for(const op of this.pending[name]||[])this.apply(f.docs,op)}
  apply(docs,op){if(op.t==="set")docs[op.id]=clone(op.d);else if(op.t==="update")docs[op.id]={...(docs[op.id]||{}),...clone(op.d)};else if(op.t==="delete")delete docs[op.id]}
  remember(name){const f=this.files[name];this.cache[name]={docs:f.docs,sha:f.sha};ghSave(GH_CACHE_KEY,this.cache)}
  fail(name,e){const f=this.files[name];setSync("err","مش متصل، هيحاول تاني");f.subs.forEach(s=>!f.loaded&&s.err&&s.err(e));
    clearTimeout(f.retryT);f.retryT=setTimeout(()=>this.fetch(name).then(()=>this.flushSoon(name,10)).catch(err=>this.fail(name,err)),15000)}
  emit(name){const f=this.files[name];if(!f.loaded&&!this.cache[name])return;
    for(const s of f.subs)this.deliver(f,s)}
  deliver(f,s){
    if(s.docId){const d=f.docs[s.docId];s.fn({id:s.docId,exists:!!d,data:()=>d?clone(d):undefined});return}
    let ids=Object.keys(f.docs);if(s.where){const [k,op,v]=s.where;ids=ids.filter(id=>{const x=f.docs[id][k];return op===">="?x>=v:op==="=="?x===v:op==="<="?x<=v:true})}
    s.fn({docs:ids.map(id=>({id,exists:true,data:()=>clone(f.docs[id])}))})}
  write(name,op){const f=this.file(name);(this.pending[name]=this.pending[name]||[]).push(op);ghSave(GH_PENDING_KEY,this.pending);
    this.apply(f.docs,op);this.remember(name);this.emit(name);this.flushSoon(name,700);return Promise.resolve()}
  flushSoon(name,ms){const f=this.files[name];if(!f||!(this.pending[name]||[]).length)return;clearTimeout(f.timer);f.timer=setTimeout(()=>{f.timer=null;this.flush(name)},ms);setSync("busy","بيحفظ…")}
  async flush(name){
    const f=this.files[name];if(!f.loaded||this.authBad)return;
    if(f.inflight){f.again=true;return}
    const ops=(this.pending[name]||[]).slice();if(!ops.length)return;
    f.inflight=true;setSync("busy","بيحفظ…");
    try{
      const body={message:`دفتر: ${name} (${ops.length} تعديل)`,content:b64enc(JSON.stringify(f.docs,null,1)+"\n"),branch:this.cfg.branch||"main"};
      if(f.sha)body.sha=f.sha;
      const r=await this.req(`/contents/data/${name}.json`,{method:"PUT",body:JSON.stringify(body)});
      if(r.status===409||r.status===422){await this.fetch(name);f.inflight=false;return this.flush(name)}
      if(!r.ok)throw new Error("http "+r.status);
      const j=await r.json();f.sha=j.content.sha;
      this.pending[name]=(this.pending[name]||[]).slice(ops.length);ghSave(GH_PENDING_KEY,this.pending);this.remember(name);
      f.retry=0;f.inflight=false;
      if(f.again||(this.pending[name]||[]).length){f.again=false;return this.flush(name)}
      if(!this.busy())setSync("","اتحفظ");
    }catch(e){f.inflight=false;if(this.authBad)return;f.retry=Math.min(f.retry+1,5);setSync("err","مش متصل، هيحاول تاني");
      clearTimeout(f.timer);f.timer=setTimeout(()=>{f.timer=null;this.flush(name)},2000*2**f.retry)}
  }
  async poll(){
    if(this.authBad||!Object.keys(this.files).length)return;
    try{const r=await this.req(`/contents/data?ref=${encodeURIComponent(this.cfg.branch||"main")}`);if(!r.ok)return;
      const list=await r.json();for(const it of list){const name=it.name.replace(/\.json$/,"");const f=this.files[name];
        if(f&&f.loaded&&f.sha!==it.sha&&!f.inflight&&!f.timer&&!(this.pending[name]||[]).length){await this.fetch(name)}}
      if(!this.busy())setSync("","اتحفظ");
    }catch(_){}
  }
  collection(name){const self=this;
    const sub=(fn,err,where)=>{const f=self.file(name);const s={fn,err,where};f.subs.push(s);if(f.loaded)self.deliver(f,s);return()=>{f.subs=f.subs.filter(x=>x!==s)}};
    return{doc:id=>({set:d=>self.write(name,{t:"set",id,d}),update:d=>self.write(name,{t:"update",id,d}),delete:()=>self.write(name,{t:"delete",id})}),
      onSnapshot:(fn,err)=>sub(fn,err),
      where:(k,op,v)=>({onSnapshot:(fn,err)=>sub(fn,err,[k,op,v])})}}
  doc(path){const [c,id]=path.split("/");const self=this;
    return{onSnapshot:(fn,err)=>{const f=self.file(c);const s={fn,err,docId:id};f.subs.push(s);if(f.loaded)self.deliver(f,s);return()=>{f.subs=f.subs.filter(x=>x!==s)}}}}
}
async function ghCheck(cfg){
  try{const r=await fetch(`https://api.github.com/repos/${cfg.repo}`,{cache:"no-store",headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+cfg.token}});
    if(r.status===401)return"المفتاح غلط أو انتهى. اعمل مفتاح جديد.";
    if(r.status===404||r.status===403)return"مش لاقي الريبو، أو المفتاح مش مسموحله يدخل عليه. اتأكد من اسم الريبو، وإن المفتاح مختار عليه الريبو ده.";
    if(!r.ok)return"GitHub مردش ("+r.status+"). جرّب تاني.";
    const j=await r.json();if(j.permissions&&j.permissions.push===false)return"المفتاح بيقرا بس. لازم Contents يبقى Read and write.";
    return"";
  }catch(_){return"مفيش نت، أو GitHub مش بيرد. جرّب تاني."}
}
function ghConnectView(msg){
  const cfg=ghLoad(GH_CFG_KEY)||{};ghScreen=true;$("#tabs").hidden=!cfg.token;$("#foot").hidden=true;
  $("#chips").hidden=true;const tb=document.querySelector(".wrap>.bar");if(tb)tb.hidden=true;
  $("#view").innerHTML=`<section class="section"><form class="gh" id="gh-form" autocomplete="off">
    <h2>وصّل الدفتر بالداتا بتاعتك</h2>
    <p class="note" style="margin:0">التسكات محفوظة في الريبو الخاص بتاعك على GitHub. الصفحة محتاجة مفتاح يدخل على الريبو ده بس. المفتاح بيتحفظ في المتصفح ده بس، ومحدش غيرك بيشوفه.</p>
    <ol>
      <li>افتح <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a></li>
      <li>الاسم: <code>daftar-malek</code>. والـ Expiration: سنة.</li>
      <li>Repository access: <b>Only select repositories</b>، واختار <code>daftar-malek-data</code> بس.</li>
      <li>Permissions ← Repository permissions ← <b>Contents</b>: <b>Read and write</b>.</li>
      <li>Generate token، وانسخه وحطه تحت.</li>
    </ol>
    <label>الريبو<input id="gh-repo" value="${esc(cfg.repo||"MalekAhmed01/daftar-malek-data")}" spellcheck="false"></label>
    <label>المفتاح<input id="gh-token" type="password" value="" placeholder="github_pat_…" spellcheck="false"></label>
    ${msg?`<div class="err">${esc(msg)}</div>`:""}
    <div class="actions"><div class="grow"><button class="btn primary" type="submit">اتصل</button>${cfg.token?`<button class="btn" type="button" id="gh-back">رجوع</button>`:""}</div>
    ${cfg.token?`<button class="btn danger" type="button" id="gh-forget">افصل المتصفح ده</button>`:""}</div>
  </form></section>`;
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="gh-form")return;e.preventDefault();
  const old=ghLoad(GH_CFG_KEY)||{};
  const cfg={repo:$("#gh-repo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/$/,""),token:$("#gh-token").value.trim()||old.token||"",branch:"main"};
  if(!/^[\w.-]+\/[\w.-]+$/.test(cfg.repo)){ghConnectView("اكتب الريبو بالشكل ده: MalekAhmed01/daftar-malek-data");return}
  if(!cfg.token){ghConnectView("حط المفتاح.");return}
  const btn=e.target.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="بيتأكد…";
  const err=await ghCheck(cfg);if(err){ghConnectView(err);return}
  if(old.repo&&old.repo!==cfg.repo){ghSave(GH_CACHE_KEY,null);ghSave(GH_PENDING_KEY,null)}
  ghSave(GH_CFG_KEY,cfg);location.reload();
});
document.addEventListener("click",e=>{
  if(e.target.id==="gh-settings"||(e.target.closest&&e.target.closest("#sync.err"))){ghConnectView("");return}
  if(e.target.id==="gh-back"){location.reload();return}
  if(e.target.id==="gh-forget"){if(e.target.dataset.sure!=="1"){e.target.dataset.sure="1";e.target.textContent="متأكد؟ اضغط تاني";return}
    ghSave(GH_CFG_KEY,null);ghSave(GH_CACHE_KEY,null);ghSave(GH_PENDING_KEY,null);location.reload()}
});

(async()=>{
  if(window.claude?.use){db=await window.claude.use("db")}
  else{const cfg=ghLoad(GH_CFG_KEY);
    if(!cfg||!cfg.token){ghConnectView("");return}
    db=new GitHubDB(cfg);$("#foot").hidden=false;setSync("busy","بيحمّل…");}
  if(!db){loaded=true;$("#view").innerHTML=`<div class="empty">التسكات مش متاحة في العرض ده. افتح الصفحة من حسابك على claude.ai.</div>`;return}
  col=db.collection("tasks");
  col.onSnapshot(snap=>{
    tasks=snap.docs.map(d=>{const x=normArea({id:d.id,...d.data()});if(x.pri==="yellow")x.pri="blue";return x});const first=!loaded;loaded=true;render();if(first&&pomo)paintPomo();
  },err=>{if(loaded)return;loaded=true;$("#view").innerHTML=`<div class="empty">مقدرتش أجيب التسكات. اتأكد إن النت شغال، أو دوس على الترس فوق ← «الاتصال بـ GitHub».</div>`});
  const keepTyping=()=>{const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&(view==="projects"||view==="notes")};
  routCol=db.collection("routine");
  routCol.where("d",">=",ymd(new Date(Date.now()-13*864e5))).onSnapshot(snap=>{
    routineDays={};snap.docs.forEach(d=>{routineDays[d.id]=d.data()});render();
  },()=>{});
  trashCol=db.collection("trash");const purged=new Set();
  trashCol.onSnapshot(snap=>{trash=snap.docs.map(d=>{const x=d.data();return {...x,oid:x.id,id:d.id}});
    trash.filter(x=>Date.now()-(x.deletedAt||0)>WEEK&&!purged.has(x.id)).forEach(x=>{purged.add(x.id);trashCol.doc(x.id).delete().catch(()=>{})});trash=trash.filter(x=>!purged.has(x.id));
    if(view==="settings")render()},()=>{});
  db.doc("config/areas").onSnapshot(d=>{areaCfg=d.exists?d.data():null;applyAreaCfg();if(view!=="settings"||!setDraft)render()},()=>{});
  db.doc("config/routine").onSnapshot(d=>{const items=d.exists&&d.data().items;if(Array.isArray(items)&&items.length){routineItems=items;render()}},()=>{});
  meetCol=db.collection("meetings");
  meetCol.onSnapshot(snap=>{meetings=snap.docs.map(d=>({id:d.id,...d.data()}));meetAlerts();if(view==="today"&&!meetEdit)render()},()=>{});
  notesCol=db.collection("notes");
  notesCol.onSnapshot(snap=>{notes=snap.docs.map(d=>{const x={id:d.id,...d.data()};const m=LEGACY[x.area];if(m)x.area=m[0];return x});if(keepTyping())pendingRender=true;else render()},()=>{});
  projCol=db.collection("projects");
  projCol.onSnapshot(snap=>{
    const active=document.activeElement;const keep=active&&active.tagName==="INPUT"&&view==="projects";
    projects=snap.docs.map(d=>{const x={id:d.id,...d.data()};const m=LEGACY[x.area];if(m)x.area=m[0];return x});
    if(keep)pendingRender=true;else render();
  },()=>{});
  sesCol=db.collection("focus");
  sesCol.onSnapshot(snap=>{sessions=snap.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  setCol=db.collection("settings");
  setCol.onSnapshot(snap=>{const cc=snap.docs.find(x=>x.id==="calendar");calCfg=cc&&cc.data().url?cc.data():null;const d=snap.docs.find(x=>x.id==="pomo");if(d){pset={...pset,...d.data()};render();if(pomo)paintPomo()}},()=>{});
  clientsCol=db.collection("clients");
  clientsCol.onSnapshot(snap=>{clients=snap.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
})();
</script>
